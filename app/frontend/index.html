<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoExpense — AI Business Expense Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app-shell">
  <nav id="nav"></nav>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <button class="sidebar-action-btn" onclick="copyInviteLink()">👥 Invite</button>
        <button class="sidebar-action-btn" onclick="exportCSV()">📥 CSV</button>
      </div>

      <!-- Summary cards -->
      <div id="summary-cards">
        <div class="card card-total">
          <div class="card-label">Total Expenses</div>
          <div class="card-value" id="total-amount">$0</div>
          <div class="card-sub" id="expense-count">0 transactions</div>
        </div>
        <div class="card card-deductible">
          <div class="card-label">Tax Deductible</div>
          <div class="card-value" id="deductible-amount">$0</div>
          <div class="card-sub" id="savings-amount">Est. $0 savings</div>
        </div>
      </div>

      <!-- Date filters -->
      <div id="filter-section">
        <h3>Filter by Date</h3>
        <div class="form-row">
          <div class="form-group">
            <label>From</label>
            <input type="date" id="filter-from" />
          </div>
          <div class="form-group">
            <label>To</label>
            <input type="date" id="filter-to" />
          </div>
        </div>
      </div>

      <!-- Category breakdown -->
      <div id="category-section">
        <h3>By Category</h3>
        <div id="category-list"></div>
      </div>

      <!-- Pending approval (admins only) -->
      <div id="pending-section" class="hidden">
        <h3>Pending Approval <span id="pending-badge" class="hidden badge-pending">0</span></h3>
      </div>

      <!-- Expense list -->
      <div id="expense-list-section">
        <h3>Recent Expenses</h3>
        <div id="expense-list"></div>
      </div>
    </aside>

    <!-- Map area -->
    <div id="map-wrap">
      <div id="search-container">
        <div id="search-box">
          <span id="search-icon">🔍</span>
          <input id="search-input" type="text" placeholder="Search for a place…" autocomplete="off" spellcheck="false" />
          <button id="search-clear" class="hidden" onclick="clearSearch()">✕</button>
        </div>
        <div id="search-results" class="hidden"></div>
      </div>

      <div id="map"></div>
      <button id="layer-toggle" onclick="toggleLayer()">🛰 Satellite</button>
      <label id="scan-receipt-fab" for="fab-receipt-file" title="Scan a receipt">📷</label>
      <input type="file" id="fab-receipt-file" accept="image/*" class="hidden" onchange="handleFabReceipt(this)" />
      <div id="map-hint-bar">📍 Click map to add expense · Press <kbd>N</kbd> at map center</div>
    </div>
  </div>
  </div>

  <!-- Add / Edit Expense Modal -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <div id="modal-header">
        <div>
          <h2 id="modal-title-text">Add Expense</h2>
        </div>
        <button id="modal-close" onclick="closeModal()">✕</button>
      </div>
      <!-- Receipt upload -->
      <div id="receipt-upload-row">
        <button type="button" id="receipt-upload-btn" onclick="document.getElementById('receipt-file').click()">
          📷 Scan Receipt
        </button>
        <input type="file" id="receipt-file" accept="image/*" class="hidden" onchange="handleReceiptUpload(this)" />
        <div id="receipt-preview" class="hidden">
          <img id="receipt-preview-img" alt="Receipt" />
        </div>
      </div>
      <input type="hidden" id="f-receipt-url" />

      <!-- Error message -->
      <div id="modal-error" class="hidden"></div>

      <form id="expense-form" onsubmit="submitExpense(event)">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="f-title" placeholder="e.g. Work dinner, team lunch, flight to NYC…" required oninput="debouncedPreview()" />
          <div id="ai-preview" class="hidden"></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Amount ($)</label>
            <input type="number" id="f-amount" placeholder="0.00" step="0.01" min="0" required />
          </div>
          <div class="form-group">
            <label>Vendor / Merchant</label>
            <input type="text" id="f-vendor" placeholder="e.g. Starbucks" required />
          </div>
        </div>
        <div class="form-group">
          <label>City / Location <span id="city-status"></span></label>
          <input type="text" id="f-city" placeholder="e.g. San Francisco — or click the map" />
        </div>
        <input type="hidden" id="f-lat" />
        <input type="hidden" id="f-lng" />
        <div id="form-actions">
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn-primary" id="submit-btn">
            <span id="submit-text">✨ Add with AI</span>
            <span id="submit-spinner" class="hidden">Analyzing…</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="/static/auth.js"></script>
  <script src="/static/nav.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
