<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoExpense — Sign In</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="auth-page">
  <div id="auth-wrap">
    <div id="auth-card">
      <div id="auth-logo">
        <span>📍</span>
        <div>
          <h1>GeoExpense</h1>
          <p>AI-Powered Expense Tracker</p>
        </div>
      </div>

      <!-- Tab switcher -->
      <div id="auth-tabs">
        <button class="auth-tab active" onclick="showTab('signin')">Sign In</button>
        <button class="auth-tab" onclick="showTab('signup')">Create Account</button>
      </div>

      <div id="auth-error" class="hidden"></div>

      <!-- Sign In -->
      <form id="signin-form" onsubmit="handleSignin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="si-email" placeholder="you@company.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="si-password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary btn-full" id="si-btn">Sign In</button>
        <div class="auth-divider"><span>or</span></div>
        <a href="/api/auth/google" class="btn-google">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2.04a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/><path fill="#FBBC05" d="M4.5 10.48A4.8 4.8 0 0 1 4.5 7.52V5.45H1.83a8 8 0 0 0 0 7.1l2.67-2.07z"/><path fill="#EA4335" d="M8.98 3.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.45L4.5 7.52c.53-1.56 2-2.34 4.48-2.34z"/></svg>
          Continue with Google
        </a>
        <p class="auth-hint">Demo: demo@geoexpense.com / demo1234</p>
      </form>

      <!-- Sign Up -->
      <form id="signup-form" class="hidden" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" id="su-name" placeholder="Jane Smith" required />
        </div>
        <div class="form-group">
          <label>Work Email</label>
          <input type="email" id="su-email" placeholder="you@company.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="su-password" placeholder="Min 8 characters" required minlength="8" autocomplete="new-password" />
        </div>
        <div class="form-group" id="company-group">
          <label>Company Name</label>
          <input type="text" id="su-company" placeholder="Acme Corp" />
        </div>
        <div id="invite-notice" class="hidden">
          <span>🎉 You're joining via an invite link</span>
        </div>
        <input type="hidden" id="su-invite" />
        <button type="submit" class="btn-primary btn-full" id="su-btn">Create Account</button>
        <div class="auth-divider"><span>or</span></div>
        <a href="/api/auth/google" class="btn-google">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2.04a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/><path fill="#FBBC05" d="M4.5 10.48A4.8 4.8 0 0 1 4.5 7.52V5.45H1.83a8 8 0 0 0 0 7.1l2.67-2.07z"/><path fill="#EA4335" d="M8.98 3.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.45L4.5 7.52c.53-1.56 2-2.34 4.48-2.34z"/></svg>
          Continue with Google
        </a>
      </form>
    </div>
  </div>

  <script>
    // Pre-fill invite token from URL
    const params = new URLSearchParams(location.search);
    const invite = params.get('invite');
    if (invite) {
      document.getElementById('su-invite').value = invite;
      document.getElementById('company-group').classList.add('hidden');
      document.getElementById('invite-notice').classList.remove('hidden');
      showTab('signup');

      // Fetch company name to show in the notice
      fetch(`/api/auth/invite/${invite}`)
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (data) {
            document.getElementById('invite-notice').innerHTML =
              `🎉 You've been invited to join <strong>${data.company_name}</strong> as ${data.role}`;
          } else {
            document.getElementById('invite-notice').innerHTML =
              '⚠️ This invite link is invalid or has expired.';
            document.getElementById('invite-notice').style.background = '#fee2e2';
            document.getElementById('invite-notice').style.color = '#991b1b';
          }
        })
        .catch(() => {});
    }

    function showTab(tab) {
      document.querySelectorAll('.auth-tab').forEach((b, i) => b.classList.toggle('active', i === (tab === 'signin' ? 0 : 1)));
      document.getElementById('signin-form').classList.toggle('hidden', tab !== 'signin');
      document.getElementById('signup-form').classList.toggle('hidden', tab !== 'signup');
      clearError();
    }

    function showError(msg) {
      const el = document.getElementById('auth-error');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function clearError() {
      document.getElementById('auth-error').classList.add('hidden');
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.textContent = loading ? 'Please wait…' : (btnId === 'si-btn' ? 'Sign In' : 'Create Account');
    }

    async function handleSignin(e) {
      e.preventDefault();
      clearError();
      setLoading('si-btn', true);
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('si-email').value,
            password: document.getElementById('si-password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Login failed');
        storeTokens(data);
        location.href = '/';
      } catch (err) {
        showError(err.message);
      } finally {
        setLoading('si-btn', false);
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      clearError();
      setLoading('su-btn', true);
      try {
        const invite = document.getElementById('su-invite').value;
        const body = {
          name: document.getElementById('su-name').value,
          email: document.getElementById('su-email').value,
          password: document.getElementById('su-password').value,
          company_name: document.getElementById('su-company').value || 'My Company',
        };
        if (invite) body.invite_token = invite;
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Registration failed');
        storeTokens(data);
        location.href = '/';
      } catch (err) {
        showError(err.message);
      } finally {
        setLoading('su-btn', false);
      }
    }

    function storeTokens(data) {
      localStorage.setItem('access_token', data.access_token);
      localStorage.setItem('refresh_token', data.refresh_token);
      localStorage.setItem('user', JSON.stringify(data.user));
    }
  </script>
</body>
</html>
