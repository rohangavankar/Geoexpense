<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — GeoExpense</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="inner-page">
  <nav id="nav"></nav>
  <div class="page-wrap">
    <h1 class="page-title">Profile</h1>

    <div id="alert" class="hidden"></div>

    <!-- Account info -->
    <div class="card-section">
      <h3>Account Details</h3>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="f-name" placeholder="Your name" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="f-email" disabled style="opacity:0.6;cursor:not-allowed" />
      </div>
      <div class="form-group">
        <label>Company</label>
        <input type="text" id="f-company" disabled style="opacity:0.6;cursor:not-allowed" />
      </div>
      <div class="form-group">
        <label>Role</label>
        <input type="text" id="f-role" disabled style="opacity:0.6;cursor:not-allowed" />
      </div>
      <button class="btn-primary" onclick="saveName()">Save Name</button>
    </div>

    <!-- Change password -->
    <div class="card-section">
      <h3>Change Password</h3>
      <div class="form-group">
        <label>Current Password</label>
        <input type="password" id="f-current-pw" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="f-new-pw" placeholder="Min 8 characters" autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" id="f-confirm-pw" placeholder="Repeat new password" autocomplete="new-password" />
      </div>
      <button class="btn-primary" onclick="changePassword()">Update Password</button>
    </div>
  </div>

  <script src="/static/auth.js"></script>
  <script src="/static/nav.js"></script>
  <script>
    if (!Auth.requireAuth()) throw new Error('redirect');
    Nav.init('profile');

    async function loadProfile() {
      const res = await Auth.apiFetch('/api/company/profile');
      if (!res.ok) return;
      const p = await res.json();
      document.getElementById('f-name').value = p.name;
      document.getElementById('f-email').value = p.email;
      document.getElementById('f-company').value = p.company_name;
      document.getElementById('f-role').value = p.role.charAt(0).toUpperCase() + p.role.slice(1);
    }

    function showAlert(msg, type = 'success') {
      const el = document.getElementById('alert');
      el.className = type === 'success' ? 'alert-success' : 'alert-error';
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4000);
    }

    async function saveName() {
      const name = document.getElementById('f-name').value.trim();
      if (!name) return showAlert('Name cannot be empty.', 'error');
      const res = await Auth.apiFetch('/api/company/profile', {
        method: 'PUT',
        body: JSON.stringify({ name }),
      });
      if (res.ok) {
        const p = await res.json();
        const user = Auth.getUser();
        if (user) { user.name = p.name; localStorage.setItem('user', JSON.stringify(user)); }
        showAlert('Name updated successfully.');
      } else {
        const e = await res.json().catch(() => ({}));
        showAlert(e.detail || 'Failed to update name.', 'error');
      }
    }

    async function changePassword() {
      const current = document.getElementById('f-current-pw').value;
      const next = document.getElementById('f-new-pw').value;
      const confirm = document.getElementById('f-confirm-pw').value;
      if (!current || !next) return showAlert('Please fill in all password fields.', 'error');
      if (next !== confirm) return showAlert('New passwords do not match.', 'error');
      if (next.length < 8) return showAlert('Password must be at least 8 characters.', 'error');
      const res = await Auth.apiFetch('/api/company/profile', {
        method: 'PUT',
        body: JSON.stringify({ current_password: current, new_password: next }),
      });
      if (res.ok) {
        document.getElementById('f-current-pw').value = '';
        document.getElementById('f-new-pw').value = '';
        document.getElementById('f-confirm-pw').value = '';
        showAlert('Password changed successfully.');
      } else {
        const e = await res.json().catch(() => ({}));
        showAlert(e.detail || 'Failed to change password.', 'error');
      }
    }

    loadProfile();
  </script>
</body>
</html>
